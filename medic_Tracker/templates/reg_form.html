<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register now</title>
     {% load static %}
     <link rel="stylesheet" href="{% static 'style.css' %}">
     <style>*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background-image:url('https://images.unsplash.com/photo-1587854692152-cbe660dbde88');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    position:relative;
}

/* Dark overlay */
body::before{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
}

.container{
    position:relative;
    z-index:1;
    width:100%;
    max-width:650px;
    padding:20px;
}

.form-card{
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    padding:40px;
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
}

h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:2.5rem;
}

form p{
    margin-bottom:18px;
}

label{
    color:white;
    font-weight:500;
    margin-bottom:6px;
    display:block;
}

input,
select,
textarea{
    width:100%;
    padding:12px 15px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.2);
    color:white;
    font-size:15px;
}

input::placeholder{
    color:#eee;
}

input:focus,
select:focus,
textarea:focus{
    outline:none;
    background:rgba(255,255,255,0.3);
}

.btn-primary{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#00c6a7,#1e90ff);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn-primary:hover{
    transform:translateY(-3px);
}

.alert-success{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    background:rgba(40,167,69,0.9);
    color:white;
    text-align:center;
}

@media(max-width:768px){
    .form-card{
        padding:25px;
    }

    h1{
        font-size:2rem;
    }
}</style>
</head>
<body>
     <nav class="navbar navbar-expand-lg custom-navbar">
    <div class="container">
        <a class="navbar-brand" href="{% url 'home.html' %}">💊 Medicine Tracker</a>
        <button class="navbar-toggler" type="button"data-bs-toggle="collapse"data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span></button>
    </div>
    </nav>
    <div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 100vh;">
    <h1>Register now</h1>
    <form method="post" action="">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary" name="submit">Submit</button>
    </form>
    {% if success_message %}
        <div class="alert alert-success mt-3">{{ success_message }} </div>
      {% endif %}
    </div>
</body>
</html>
