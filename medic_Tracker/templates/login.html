<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    {% load static %}
    <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background-image:url('https://images.unsplash.com/photo-1587854692152-cbe660dbde88');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    position:relative;
}
body::before{
    content:'';
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.45);
}

.container{
    position:relative;
    z-index:1;
    width:30%;
    max-width:650px;
    padding:20px;
}

.login-container{
    background: white;
    padding: 40px;
    width: 350px;
    border-radius: 10px;
    box-shadow: 0px 4px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:2.5rem;
}


.form-group{
    margin-bottom: 15px;
}

label{
    color:white;
    font-weight:500;
    margin-bottom:6px;
    display:block;
}
input{
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    box-sizing: border-box;
}

input:focus{
    outline: none;
    border-color: #0d6efd;
}

button{

    width:100%;
    padding:10px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#00c6a7,#1e90ff);
    color:white;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
   transform:translateY(-3px);
}
@media(max-width:768px){
    .form-card{
        padding:25px;
    }

    h1{
        font-size:2rem;
    }
}
</style>
</head>
<body>
    <div class="container">
        <h1>Login Here</h1>
       <form method="POST">
    {% csrf_token %}

    <input type="text"
           name="username"
           placeholder="Username"
           required>

    <br><br>

    <input type="password"
           name="password"
           placeholder="Password"
           required>

    <br><br>

    <button type="submit">Login</button>
</form>

{% if error_message %}
<p style="color:red;">{{ error_message }}</p>
{% endif %}
    </div>
</body>
</html>
