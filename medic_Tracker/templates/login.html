<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    {% load static %}
    
</head>
<body>
    <div class="container">
        <h1>Login Here</h1>
        <form method="post" action="{% url 'login.html' %}">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" action="{% url 'user_interface.html' %}">Login</button>
        </form>
        {% if error_message %}
            <p style="color: red;">{{ error_message }}</p>
        {% endif %}
    </div>
</body>
</html>
